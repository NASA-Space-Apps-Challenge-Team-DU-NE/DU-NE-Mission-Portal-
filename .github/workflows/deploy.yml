# main에 올리면 Cloudflare Pages로 배포한다. 저장소는 비공개로 두고 빌드 결과(web/dist)만 올린다.
# 배포된 사이트는 주소를 아는 누구나 열 수 있다(빌드된 JS와 data/ 포함).
#
# 처음 한 번 필요한 설정 (저장소 Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   권한: Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 오른쪽의 Account ID
# Cloudflare Pages 프로젝트(du-ne-mission-portal)는 미리 만들어 둔다(Direct Upload).
# Cloudflare Pages는 파일 하나당 25 MiB 제한이 있다. 큰 데이터 파일은 빌드 뒤 검사한다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: 25 MiB 넘는 파일 검사
        run: |
          big=$(find web/dist -type f -size +25M)
          if [ -n "$big" ]; then echo "Cloudflare Pages 제한(25 MiB)을 넘는 파일:"; ls -lh $big; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=du-ne-mission-portal --branch=main
