[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.1.0"
description = "LUNA-NAV 사전 계산 파이프라인 (Drive DU_NE Data → web/public/data)"
requires-python = ">=3.11"

[project.scripts]
luna = "luna.cli:main"

[tool.setuptools.packages.find]
include = ["luna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
